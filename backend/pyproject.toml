[project]
name = "fintech-operations-dashboard"
version = "0.1.0"
description = "FastAPI backend for the Fintech Operations Dashboard"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pydantic[email]>=2.10.0",
    "pydantic-settings>=2.6.0",
    "python-jose[cryptography]>=3.3.0",
    "cryptography>=43.0.0",
    "passlib[bcrypt]>=1.7.4",
    # passlib's bcrypt backend detection reads bcrypt.__about__, which bcrypt
    # removed in 4.1 — pin below that until passlib ships a fix.
    "bcrypt<4.1",
    "python-multipart>=0.0.18",
    "pyotp>=2.9.0",
    "reportlab>=4.2.0",
    "slowapi>=0.1.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# B008 flags FastAPI's Depends()-in-default idiom, which is the framework's
# documented pattern, not a bug. RUF012 flags Pydantic's per-instance-copied
# mutable defaults, which are safe (unlike the dataclass/stdlib case the rule
# is written for).
ignore = ["B008", "RUF012"]

[tool.pyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.11"
extraPaths = ["."]
